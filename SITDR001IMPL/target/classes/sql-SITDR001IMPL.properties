insert_entretenimiento=db1;INSERT INTO SITD.CATALOGO_ENTRETENIMIENTO (TITULO,TIPO,GENERO,ANIO_ESTRENO,DIRECTOR,DURACION_MIN,PAIS_ORIGEN,CLASIFICACION,IDIOMA_ORIGINAL, \
    PLATAFORMA,CALIFICACION) VALUES (:inTITULO, :inTIPO, :inGENERO,:inANIO_ESTRENO,:inDIRECTOR,:inDURACION_MIN,:inPAIS_ORIGEN,:inCLASIFICACION,:inIDIOMA_ORIGINAL, \
    :inPLATAFORMA,:inCALIFICACION);
    
select_contenido=db1;SELECT \
    ID_CONTENIDO, \
    TITULO, \
    TIPO, \
    GENERO, \
    ANIO_ESTRENO, \
    DIRECTOR, \
    DURACION_MIN, \
    PAIS_ORIGEN, \
    CLASIFICACION, \
    IDIOMA_ORIGINAL, \
    PLATAFORMA, \
    CALIFICACION, \
    DISPONIBLE, \
    FECHA_REGISTRO \
FROM SITD.CATALOGO_ENTRETENIMIENTO \
WHERE  (:inTITULO IS NULL OR UPPER(TITULO) LIKE '%' || UPPER(:inTITULO) || '%') \
  AND (:inTIPO IS NULL OR TIPO = :inTIPO) \
  AND (:inGENERO IS NULL OR GENERO = :inGENERO) \
  AND (:inANIO_ESTRENO IS NULL OR ANIO_ESTRENO = :inANIO_ESTRENO) \
  AND (:inDIRECTOR IS NULL OR UPPER(DIRECTOR) LIKE '%' || UPPER(:inDIRECTOR) || '%') \
  AND (:inDURACION_MIN IS NULL OR DURACION_MIN = :inDURACION_MIN) \
  AND (:inPAIS_ORIGEN IS NULL OR PAIS_ORIGEN = :inPAIS_ORIGEN) \
  AND (:inCLASIFICACION IS NULL OR CLASIFICACION = :inCLASIFICACION) \
  AND (:inIDIOMA_ORIGINAL IS NULL OR IDIOMA_ORIGINAL = :inIDIOMA_ORIGINAL) \
  AND (:inPLATAFORMA IS NULL OR PLATAFORMA = :inPLATAFORMA) \
  AND (:inCALIFICACION IS NULL OR CALIFICACION >= :inCALIFICACION) \
  AND (:inDISPONIBLE IS NULL OR DISPONIBLE = :inDISPONIBLE) \
ORDER BY TITULO;

